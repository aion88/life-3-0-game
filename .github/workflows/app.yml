# CI: tests on every push and pull request.
# GitHub Pages deploy only on master and only when the tests pass.
name: app

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Public deploy path: /<repository name>/ (build and e2e share it).
  APP_BASE: /${{ github.event.repository.name }}/

defaults:
  run:
    working-directory: app

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Vitest workers exceed the default Node heap on the runner.
      - run: npm run test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Non blocking: this suite judges the 3D street week and legacy world screens.
      - name: e2e:street
        continue-on-error: true
        timeout-minutes: 45
        run: |
          if [ -f playwright.street.config.ts ]; then
            # webgl2 only: the webgpu-mac project measures timings on a Mac GPU.
            npm run e2e:street -- --project webgl2
          else
            echo "e2e:street: config absent"
          fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
